name: RDP Windows VPS (Bore)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *' # Otomatis restart per 5 jam jika runner habis masa aktif

concurrency:
  group: vps-bore-runner
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 1440

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Optimasi Performa & Anti-Crash
        run: |
          # Matikan sleep & hemat daya agar runner tidak disconnect
          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0
          
          # Prioritaskan service runner agar tidak dimatikan saat RAM penuh
          Get-Process -Name "Runner.Listener", "Runner.Worker" -ErrorAction SilentlyContinue | ForEach-Object {
              $_.PriorityClass = [System.Diagnostics.ProcessPriorityClass]::High
          }

      - name: Download and Extract Bore
        run: |
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip" -OutFile bore.zip
          Expand-Archive bore.zip -DestinationPath bore

      - name: Enable RDP + Create Admin User
        env:
          RDP_PASS: ${{ secrets.RDP_PASSWORD }}
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $pass = ConvertTo-SecureString "$env:RDP_PASS" -AsPlainText -Force
          New-LocalUser "admin" -Password $pass -FullName "admin"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "admin"
          Add-LocalGroupMember -Group "Administrators" -Member "admin"

      - name: Optimasi Registry 4K (Grafik Mulus)
        run: |
          $tsPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (!(Test-Path $tsPath)) { New-Item -Path $tsPath -Force }
          Set-ItemProperty -Path $tsPath -Name "fEnableVirtualizedGraphics" -Value 1 -Type DWord
          Set-ItemProperty -Path $tsPath -Name "MinFrameRate" -Value 120 -Type DWord

      - name: Setup Auto Run auto.bat
        shell: bash
        run: |
          mkdir -p "/c/ProgramData/Microsoft/Windows/Start Menu/Programs/StartUp"
          cat << 'EOF' > "/c/ProgramData/Microsoft/Windows/Start Menu/Programs/StartUp/auto.bat"
          @echo off
          net session >nul 2>&1
          if %errorLevel% == 0 (
              goto :RunScript
          ) else (
              powershell -Command "Start-Process -Verb RunAs -FilePath '%0'"
              exit /b
          )

          :RunScript
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 2 /f
          reg add "HKCU\Control Panel\Desktop" /v DragFullWindows /t REG_SZ /d 0 /f
          reg add "HKCU\Control Panel\Desktop" /v FontSmoothing /t REG_SZ /d 0 /f
          net stop "SysMain" /y
          sc config "SysMain" start=disabled

          curl -L -o "%TEMP%\FileZilla_Setup.exe" "https://download.filezilla-project.org/client/FileZilla_3.70.6_win64_sponsored2-setup.exe"
          start /wait "" "%TEMP%\FileZilla_Setup.exe" /S

          curl -L -o "%USERPROFILE%\Desktop\AutoDownloader.exe" "https://www.dropbox.com/scl/fi/s4h2cp5he09gz2z3aoo5r/AutoDownloader.exe?rlkey=lntuysb790s6gg7ywgi66lvrx&st=nob074sf&dl=1"

          set "ADOBE_URL=https://contributor.stock.adobe.com/"
          set "CHROME_PATH=C:\Program Files\Google\Chrome\Application\chrome.exe"
          set "SHORTCUT_PATH=%USERPROFILE%\Desktop\Adobe Stock.lnk"
          powershell -Command "$wshell = New-Object -ComObject WScript.Shell; $shortcut = $wshell.CreateShortcut($env:SHORTCUT_PATH); $shortcut.TargetPath = $env:CHROME_PATH; $shortcut.Arguments = \"--incognito `\"$env:ADOBE_URL`\"\"; $shortcut.Save()"

          :: Buka Otomatis FileZilla, Chrome, dan AutoDownloader
          explorer.exe "C:\Program Files\FileZilla FTP Client\filezilla.exe"
          explorer.exe "%USERPROFILE%\Desktop\Adobe Stock.lnk"
          start "" "%USERPROFILE%\Desktop\AutoDownloader.exe"
          
          del "%~f0"
          exit
          EOF

      - name: Monitor Bore Stream & Self-Healing Watchdog
        env:
          RDP_PASS: ${{ secrets.RDP_PASSWORD }}
          SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
          SCRIPT_SECRET: ${{ secrets.SCRIPT_SECRET }}
        run: |
          $USER = "admin"
          $lastFullAddress = ""

          # LOOP UTAMA: Jika koneksi putus, akan otomatis restart sendiri terus menerus
          while ($true) {
              Write-Host "Memulai tunnel Bore..."
              $psi = New-Object System.Diagnostics.ProcessStartInfo
              $psi.FileName = ".\bore\bore.exe"
              $psi.Arguments = "local 3389 --to bore.pub"
              $psi.UseShellExecute = $false
              $psi.RedirectStandardOutput = $true
              $psi.RedirectStandardError = $true
              $process = [System.Diagnostics.Process]::Start($psi)

              while (!$process.HasExited) {
                  $line = $process.StandardOutput.ReadLine()
                  if ($line -match "(?:listening at|remote forwarding at) (bore\.pub:\d+)") {
                      $fullAddress = $matches[1]
                      $portOnly = $fullAddress.Split(':')[1]

                      if ($fullAddress -ne $lastFullAddress) {
                          $lastFullAddress = $fullAddress
                          Write-Host "Koneksi aktif: $fullAddress - Mengirim ke Spreadsheet..."
                          
                          $payload = @{
                              secret = "$env:SCRIPT_SECRET"
                              host = "bore.pub"
                              port = "$portOnly"
                              full_address = "bore.pub:$portOnly"
                              username = "$USER"
                              password = "$env:RDP_PASS"
                          } | ConvertTo-Json

                          try {
                              $response = Invoke-RestMethod -Uri "$env:SCRIPT_URL" -Method Post -Body $payload -ContentType "application/json"
                              Write-Host "SUKSES: Data tersimpan di Google Sheets!"
                          } catch {
                              Write-Host "Gagal kirim ke Google Sheets: $_"
                          }
                      }
                  }
                  Start-Sleep -Milliseconds 200
              }

              Write-Host "Peringatan: Koneksi Bore terputus. Mencoba menghubungkan kembali dalam 5 detik..."
              Start-Sleep -Seconds 5
          }
